<!-- بخش چت با جمنای -->
<div id="chat-screen">
    <div class="chat-header">چت با جمنای (محیط اختصاصی)</div>
    <div class="chat-messages" id="messages-container">
        <div class="message ai-message">سلام! من آماده‌ام، چه کمکی از دست من برمی‌آید؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ارسال</button>
    </div>
</div>
</div>

<script>
// رمز عبور دلخواه برای خودتان و خانواده (می‌توانید تغییرش دهید)
const FAMILY_PASSWORD = "Firooz1389kianfar"; 

// کلید API جمنای خود را اینجا قرار دهید
const GEMINI_API_KEY = "AQ.Ab8RN6KH_uzUrnuv9WwFb3SwmvChZIj-OydVavYP5Bo3Q5gXUQ";

function checkPassword() {
    const pass = document.getElementById("password-input").value;
    if (pass === FAMILY_PASSWORD) {
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
    } else {
        document.getElementById("error-msg").innerText = "رمز عبور اشتباه است!";
    }
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

async function sendMessage() {
    const inputField = document.getElementById("user-input");
    const messageText = inputField.value.trim();
    if (!messageText) return;

    const container = document.getElementById("messages-container");

    // نمایش پیام کاربر
    const userDiv = document.createElement("div");
    userDiv.className = "message user-message";
    userDiv.innerText = messageText;
    container.appendChild(userDiv);

    inputField.value = "";
    container.scrollTop = container.scrollHeight;

    // نمایش پیام در حال پردازش
    const aiDiv = document.createElement("div");
    aiDiv.className = "message ai-message";
    aiDiv.innerText = "در حال تفکر...";
    container.appendChild(aiDiv);
    container.scrollTop = container.scrollHeight;

    try {
        // اتصال به API رسمی جمنای (مدل gemini-1.5-flash)
        const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: messageText }]
                }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            aiDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
            aiDiv.innerText = "پاسخی دریافت نشد یا خطایی رخ داد.";
        }
    } catch (error) {
        aiDiv.innerText = "خطا در ارتباط با سرور هوش مصنوعی.";
        console.error(error);
    }

    container.scrollTop = container.scrollHeight;
}
</script>

</body>
</html>
